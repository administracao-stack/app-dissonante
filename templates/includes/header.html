<header class="site-header">
    <div class="container">
        <div class="navbar-content">
            
            <!-- Logo Híbrido -->
            <a href="{{ url_for('index') }}" class="brand-logo">
                <img src="{{ url_for('static', filename='logo-icon.png') }}" alt="Dissonante" class="navbar-logo-icon">
                <div class="logo-text">
                    <span class="brand-name">DISSONANTE</span>
                    <span class="brand-sub">EXPERIÊNCIAS</span>
                </div>
            </a>

            <!-- Menu Navegação Central -->
            <nav class="nav-menu">
                <a href="{{ url_for('index') }}#eventos">Eventos</a>
                <a href="{{ url_for('servicos') }}">Serviços</a>

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                    </svg>
                    Fale Conosco
                </a>
            </nav>

            <!-- Ações Dinâmicas da Sessão -->
            <div class="header-cta flex-align">
                {% if session.get('usuario_id') %}
                    <!-- Botões EXCLUSIVOS para usuários LOGADOS -->
                    <a href="{{ url_for('meus_favoritos') }}" class="btn-icon-header" aria-label="Ver Favoritos">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span class="badge">{{ session.get('favoritos')|length if session.get('favoritos') else 0 }}</span>
                    </a>

                    <a href="{{ url_for('ver_carrinho') }}" class="btn-icon-header" aria-label="Ver Carrinho">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="badge badge-accent">{{ session.get('carrinho')|length if session.get('carrinho') else 0 }}</span>
                    </a>

                    <a href="{{ url_for('perfil') }}" class="btn-cliente">Área do Cliente</a>
                    <a href="{{ url_for('logout') }}" class="btn-logout-header" aria-label="Sair">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Sair</span>
                    </a>
                {% else %}
                    <!-- Exibido apenas para usuários DESLOGADOS -->
                    <a href="{{ url_for('login') }}" class="btn-cliente">Entrar / Cadastrar</a>
                {% endif %}
            </div>

        </div>
    </div>
</header>
