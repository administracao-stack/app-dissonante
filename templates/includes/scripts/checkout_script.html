{% include 'includes/scripts/recaptcha.html' %}

<script>
    const VALOR_BASE_TOTAL = {{ total_pedido|tojson }};
    const TAXAS_MP = {
        pix: 0.0099,
        credit_card_1x: 0.0499,
        credit_card_2x: 0.1462
    };

    function calcularValorComTaxa(valorBase, taxa) {
        if (valorBase <= 0) return { final: 0, taxaVal: 0 };
        const valorFinal = Math.round((valorBase / (1 - taxa)) * 100) / 100;
        const taxaVal = Math.round((valorFinal - valorBase) * 100) / 100;
        return { final: valorFinal, taxaVal: taxaVal };
    }

    function formatarMoeda(valor) {
        return 'R$ ' + valor.toFixed(2).replace('.', ',');
    }

    // Alterna o container e recalcula o resumo com base no método selecionado
    function atualizarValoresCheckout(metodo) {
        const creditCardContainer = document.getElementById('credit-card-container');
        const labelPix = document.getElementById('label_pix');
        const labelCartao = document.getElementById('label_cartao');
        const selectInstallments = document.getElementById('installments');
        const totalDisplay = document.getElementById('total-display');
        const taxaDisplay = document.getElementById('taxa-display');

        let taxaAplicada = 0;
        let parcelas = 1;

        if (metodo === 'credit_card') {
            if (creditCardContainer) creditCardContainer.classList.remove('is-hidden');
            if (labelCartao) labelCartao.classList.add('active');
            if (labelPix) labelPix.classList.remove('active');

            if (selectInstallments) {
                parcelas = parseInt(selectInstallments.value) || 1;
            }
            taxaAplicada = (parcelas === 2) ? TAXAS_MP.credit_card_2x : TAXAS_MP.credit_card_1x;
        } else {
            if (creditCardContainer) creditCardContainer.classList.add('is-hidden');
            if (labelPix) labelPix.classList.add('active');
            if (labelCartao) labelCartao.classList.remove('active');

            taxaAplicada = TAXAS_MP.pix;
        }

        // Atualizar as labels do Select de Parcelas
        const calc1x = calcularValorComTaxa(VALOR_BASE_TOTAL, TAXAS_MP.credit_card_1x);
        const calc2x = calcularValorComTaxa(VALOR_BASE_TOTAL, TAXAS_MP.credit_card_2x);

        const opt1 = document.getElementById('opt-parcela-1');
        const opt2 = document.getElementById('opt-parcela-2');

        if (opt1) opt1.textContent = `1x de ${formatarMoeda(calc1x.final)} (À vista)`;
        if (opt2) opt2.textContent = `2x de ${formatarMoeda(calc2x.final / 2)} (Total: ${formatarMoeda(calc2x.final)})`;

        // Atualizar o resumo visual
        const resultado = calcularValorComTaxa(VALOR_BASE_TOTAL, taxaAplicada);
        if (totalDisplay) totalDisplay.textContent = formatarMoeda(resultado.final);
        if (taxaDisplay) taxaDisplay.textContent = formatarMoeda(resultado.taxaVal);
    }

    // Cronômetro de Trava dos Ingressos sincronizado com o Servidor
    function iniciarTimerReserva() {
        const display = document.getElementById('timer-reserva');
        const timerContainer = document.querySelector('.resumo-timer-card');
        if (!display || !timerContainer) return;

        // Obtém os segundos calculados dinamicamente no backend Flask
        let tempoRestante = parseInt(timerContainer.getAttribute('data-tempo-restante')) || 0;

        function atualizarDisplay() {
            if (tempoRestante <= 0) {
                display.textContent = '00:00';
                alert('O tempo de reserva dos seus ingressos expirou!');
                window.location.reload();
                return;
            }

            const minutos = Math.floor(tempoRestante / 60);
            const segundos = Math.floor(tempoRestante % 60);

            display.textContent = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;
            tempoRestante--;
        }

        if (tempoRestante > 0) {
            atualizarDisplay();
            setInterval(atualizarDisplay, 1000);
        } else {
            display.textContent = 'Expirado';
        }
    }

    // Inicialização da Página
    document.addEventListener('DOMContentLoaded', function () {
        iniciarTimerReserva();
        
        // Recalcula o valor inicial padrão (PIX)
        const metodoInicial = document.querySelector('input[name="metodo_pagamento"]:checked')?.value || 'pix';
        atualizarValoresCheckout(metodoInicial);

        const form = document.getElementById('form-checkout');
        if (!form) return;

        const mpPublicKey = "{{ mp_public_key }}";
        if (!mpPublicKey) {
            console.warn('A chave MP_PUBLIC_KEY não está configurada no ambiente.');
            return;
        }

        const mp = new MercadoPago(mpPublicKey, { locale: 'pt-BR' });

        // Identificação Automática da Bandeira e Emissor pelo BIN (6 primeiros dígitos)
        const cardNumberInput = document.getElementById('cardNumber');
        if (cardNumberInput) {
            cardNumberInput.addEventListener('input', async function () {
                const bin = this.value.replace(/\D/g, '').substring(0, 6);
                
                if (bin.length === 6) {
                    try {
                        const paymentMethods = await mp.getPaymentMethods({ bin });
                        if (paymentMethods.results && paymentMethods.results.length > 0) {
                            const method = paymentMethods.results[0];
                            document.getElementById('payment_method_id').value = method.id;
                            console.log("[MP FRONT] Bandeira identificada:", method.id);

                            // Busca o banco emissor (Issuer)
                            const issuers = await mp.getIssuers({ paymentMethodId: method.id, bin });
                            if (issuers && issuers.length > 0) {
                                document.getElementById('issuer_id').value = issuers[0].id;
                                console.log("[MP FRONT] Emissor identificado:", issuers[0].id);
                            }
                        }
                    } catch (err) {
                        console.error("[MP FRONT] Erro ao identificar bandeira:", err);
                    }
                }
            });
        }

        // Intercepta a Submissão do Formulário
        form.addEventListener('submit', async function (e) {
            const metodoInput = document.querySelector('input[name="metodo_pagamento"]:checked');
            const metodo = metodoInput ? metodoInput.value : 'pix';

            if (metodo === 'pix') {
                return; // Envia o formulário normalmente para pagamento via PIX
            }

            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit-checkout');
            if (btnSubmit) btnSubmit.disabled = true;

            try {
                const rawExpiration = document.getElementById('cardExpiration').value.trim();
                const expirationParts = rawExpiration.split('/');

                if (expirationParts.length !== 2) {
                    throw new Error('Data de validade do cartão inválida. Use o formato MM/AA.');
                }

                const month = expirationParts[0].trim();
                let year = expirationParts[1].trim();
                if (year.length === 2) {
                    year = '20' + year;
                }

                // Criação do Token de Cartão
                const cardToken = await mp.createCardToken({
                    cardNumber: document.getElementById('cardNumber').value.replace(/\D/g, ''),
                    cardholderName: document.getElementById('cardholderName').value.trim(),
                    cardExpirationMonth: month,
                    cardExpirationYear: year,
                    securityCode: document.getElementById('securityCode').value.trim(),
                    identificationType: 'CPF',
                    identificationNumber: document.getElementById('cpf').value.replace(/\D/g, '')
                });

                if (!cardToken || !cardToken.id) {
                    throw new Error('Não foi possível gerar o token do cartão de crédito.');
                }

                document.getElementById('token').value = cardToken.id;

                // Caso a bandeira não tenha sido pega dinamicamente pelo evento input
                if (!document.getElementById('payment_method_id').value && cardNumberInput) {
                    const bin = cardNumberInput.value.replace(/\D/g, '').substring(0, 6);
                    const paymentMethods = await mp.getPaymentMethods({ bin });
                    if (paymentMethods.results && paymentMethods.results.length > 0) {
                        document.getElementById('payment_method_id').value = paymentMethods.results[0].id;
                    }
                }

                // Submete o formulário com todos os campos populados
                form.submit();

            } catch (error) {
                console.error('Erro na tokenização do cartão:', error);
                
                let mensagemErro = 'Erro ao processar o cartão de crédito.';
                if (Array.isArray(error) && error.length > 0) {
                    mensagemErro = error[0].message || mensagemErro;
                } else if (error.message) {
                    mensagemErro = error.message;
                }

                alert(`Atenção: ${mensagemErro}\nVerifique se está utilizando os dados de cartão de teste do Mercado Pago.`);
                if (btnSubmit) btnSubmit.disabled = false;
            }
        });
    });
</script>
