{% include 'includes/scripts/recaptcha.html' %}

<script>
    // Alterna visualmente os containers de pagamento (PIX / Cartão)
    function togglePagamento(metodo) {
        const creditCardContainer = document.getElementById('credit-card-container');
        const labelPix = document.getElementById('label_pix');
        const labelCartao = document.getElementById('label_cartao');

        if (metodo === 'credit_card') {
            if (creditCardContainer) creditCardContainer.classList.remove('is-hidden');
            if (labelCartao) labelCartao.classList.add('active');
            if (labelPix) labelPix.classList.remove('active');
        } else {
            if (creditCardContainer) creditCardContainer.classList.add('is-hidden');
            if (labelPix) labelPix.classList.add('active');
            if (labelCartao) labelCartao.classList.remove('active');
        }
    }

    // Cronômetro de Trava dos Ingressos (15 minutos)
    function iniciarTimerReserva() {
        const display = document.getElementById('timer-reserva');
        if (!display) return;

        let tempoRestante = 15 * 60; // 15 minutos em segundos

        const interval = setInterval(() => {
            const minutos = Math.floor(tempoRestante / 60);
            const segundos = tempoRestante % 60;

            display.textContent = `${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}`;

            if (--tempoRestante < 0) {
                clearInterval(interval);
                alert('O tempo de reserva dos seus ingressos expirou! A página será recarregada.');
                window.location.reload();
            }
        }, 1000);
    }

    // Inicialização da Página
    document.addEventListener('DOMContentLoaded', function () {
        iniciarTimerReserva();

        const form = document.getElementById('form-checkout');
        if (!form) return;

        const mpPublicKey = "{{ mp_public_key }}";
        if (!mpPublicKey) {
            console.warn('A chave MP_PUBLIC_KEY não está configurada no ambiente.');
        }

        const mp = new MercadoPago(mpPublicKey);

        form.addEventListener('submit', async function (e) {
            const metodoInput = document.querySelector('input[name="metodo_pagamento"]:checked');
            const metodo = metodoInput ? metodoInput.value : 'pix';

            if (metodo === 'pix') {
                return;
            }

            e.preventDefault();

            try {
                const cardExpirationValue = document.getElementById('cardExpiration').value.split('/');
                const cardToken = await mp.createCardToken({
                    cardNumber: document.getElementById('cardNumber').value.replace(/\s+/g, ''),
                    cardholderName: document.getElementById('cardholderName').value,
                    cardExpirationMonth: cardExpirationValue[0],
                    cardExpirationYear: '20' + cardExpirationValue[1],
                    securityCode: document.getElementById('securityCode').value,
                    identificationType: 'CPF',
                    identificationNumber: document.getElementById('cpf').value.replace(/\D/g, '')
                });

                document.getElementById('token').value = cardToken.id;
                document.getElementById('payment_method_id').value = cardToken.payment_method_id;

                if (cardToken.issuer_id) {
                    document.getElementById('issuer_id').value = cardToken.issuer_id;
                }

                form.submit();

            } catch (error) {
                alert('Erro ao validar os dados do cartão. Verifique os campos e tente novamente.');
            }
        });
    });
</script>
