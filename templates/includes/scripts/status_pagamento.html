<script>
    // Copia o código PIX para a área de transferência com suporte a fallback
    function copiarPix() {
        const inputPix = document.getElementById("pix-copia-cola");
        if (!inputPix) return;
        
        inputPix.select();
        inputPix.setSelectionRange(0, 99999);

        const btnCopiar = document.getElementById("btn-copiar");

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(inputPix.value).then(() => {
                exibirFeedbackCopiado(btnCopiar);
            }).catch(() => {
                document.execCommand('copy');
                exibirFeedbackCopiado(btnCopiar);
            });
        } else {
            document.execCommand('copy');
            exibirFeedbackCopiado(btnCopiar);
        }
    }

    function exibirFeedbackCopiado(btn) {
        if (!btn) return;
        btn.innerText = "Copiado! ✓";
        btn.classList.add("copied");
        
        setTimeout(() => {
            btn.innerText = "Copiar";
            btn.classList.remove("copied");
        }, 3000);
    }

    // Polling para checar confirmação do pagamento via PIX
    {% if compra and compra.metodo_pagamento == 'pix' and compra.payment_id %}
    const paymentId = "{{ compra.payment_id }}";
    
    function checarStatusPix() {
        if (!paymentId) return;
        fetch(`/api/checar-status-pagamento/${paymentId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'approved') {
                    const badge = document.getElementById('status-pix-badge');
                    if (badge) {
                        badge.classList.add('approved');
                        badge.innerText = '✅ Pagamento Aprovado! Redirecionando...';
                    }
                    setTimeout(() => {
                        window.location.href = data.redirect_url || "{{ url_for('meus_ingressos') }}";
                    }, 1200);
                }
            })
            .catch(err => console.error("Erro ao verificar status do Pix:", err));
    }

    setInterval(checarStatusPix, 3000);
    {% endif %}
</script>
