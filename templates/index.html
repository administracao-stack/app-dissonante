{% extends 'base.html' %}

{% block title %}Dissonante Experiências | Ingressos e Festas Exclusivas{% endblock %}

{% block content %}
<section class="hero-carousel-section">
    <div class="carousel-container">
        
        <!-- Card de Evento 1 -->
        <a href="{{ url_for('evento_marevibes') }}" class="carousel-card">
            <!-- Botão de favoritar -->
            <button type="button" 
                    class="btn-favorite {% if session.get('favoritos') and 'marevibes' in session.get('favoritos')|map(attribute='id')|list %}active{% endif %}" 
                    data-evento-id="marevibes" 
                    aria-label="Favoritar evento">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </button>

            <img src="{{ url_for('static', filename='marevibes-banner.jpg') }}" alt="MaréVibes Halloween 2026" class="card-img-bg">
            <div class="card-overlay"></div>
            
            <div class="card-content">
                <h2 class="card-title">MaréVibes Halloween 2026</h2>
                <div class="card-meta">
                    <div class="date-time">
                    <span class="date">31 OUT 2026</span>
                    <span class="time">• 17:00</span>
                    </div>
                    <span class="location">Itaperi, Rua Fagundes Varela</span>
                </div>
    
                <div class="card-action">
                    <span class="btn-comprar-ingresso">COMPRAR INGRESSO</span>
                </div>
            </div>
        </a>

    </div>
</section>
{% endblock %}
