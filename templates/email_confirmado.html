{% extends 'base.html' %}

{% block title %}Validação de E-mail | Dissonante Experiências{% endblock %}

{% block content %}
<main class="email-confirm-container">
    <div class="email-confirm-card">
        {% if sucesso %}
            <h1 class="email-confirm-title email-confirm-title-success">✓ E-mail Confirmado!</h1>
            <p class="email-confirm-message">{{ mensagem }}</p>
            <a href="{{ url_for('login') }}" class="btn-email-confirm btn-email-confirm-primary">Fazer Login</a>
        {% else %}
            <h1 class="email-confirm-title email-confirm-title-error">✕ Erro de Validação</h1>
            <p class="email-confirm-message">{{ mensagem }}</p>
            <a href="{{ url_for('cadastro') }}" class="btn-email-confirm btn-email-confirm-primary">Novo Cadastro</a>
        {% endif %}
    </div>
</main>
{% endblock %}
